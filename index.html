      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        wrap.querySelector('#pf-img-preview').src = ev.target.result;
        wrap.querySelector('#pf-image-url').value = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
    wrap.querySelector('#add-variant').addEventListener('click', () => {
      variants.push({ id: uid(), name: '', flavor: '', format: '', price: '', costPrice: '', available: true });
      renderVariants();
    });
  }

  function renderVariants() {
    const listEl = wrap.querySelector('#variants-list');
    if (!listEl) return;
    if (variants.length === 0) {
      listEl.innerHTML = `<p class="text-muted">Sin variantes: precio único en el producto.</p>
        <div class="field-row">
          <div class="field"><label class="field__label">Precio venta *</label>
            <input class="field__input" id="pf-price" type="number" min="0" step="0.01"
              value="${esc(existing?.price||'')}" placeholder="0.00"></div>
          <div class="field"><label class="field__label">Coste adquisición</label>
            <input class="field__input" id="pf-cost" type="number" min="0" step="0.01"
              value="${esc(existing?.costPrice||'')}" placeholder="0.00"></div>
        </div>`;
      return;
    }
    listEl.innerHTML = variants.map((v, i) => `
      <div class="variant-row" data-idx="${i}">
        <div class="variant-row__header">
          <strong>Variante ${i+1}</strong>
          <button type="button" class="btn btn--sm btn--danger variant-del" data-idx="${i}">🗑</button>
        </div>
        <div class="field-row">
          <div class="field"><label class="field__label">Nombre</label>
            <input class="field__input" data-field="name" value="${esc(v.name)}" placeholder="Nombre variante"></div>
          <div class="field"><label class="field__label">Sabor</label>
            <input class="field__input" data-field="flavor" value="${esc(v.flavor||'')}" placeholder="Sabor"></div>
        </div>
        <div class="field-row">
          <div class="field"><label class="field__label">Precio *</label>
            <input class="field__input" data-field="price" type="number" min="0" step="0.01" value="${esc(v.price)}" placeholder="0.00"></div>
          <div class="field"><label class="field__label">Coste</label>
            <input class="field__input" data-field="costPrice" type="number" min="0" step="0.01" value="${esc(v.costPrice||'')}" placeholder="0.00"></div>
        </div>
        <label class="field__label toggle-label">
          <span>Disponible</span>
          <label class="toggle"><input type="checkbox" data-field="available" ${v.available!==false?'checked':''}><span class="toggle__slider"></span></label>
        </label>
      </div>`).join('');

    listEl.querySelectorAll('.variant-del').forEach(btn => {
      btn.addEventListener('click', () => {
        variants.splice(Number(btn.dataset.idx), 1);
        renderVariants();
      });
    });
    listEl.querySelectorAll('input, select').forEach(input => {
      input.addEventListener('input', () => {
        const row  = input.closest('[data-idx]');
        const idx  = Number(row.dataset.idx);
        const field = input.dataset.field;
        variants[idx][field] = input.type === 'checkbox' ? input.checked : input.value;
      });
    });
  }

  buildForm();

  showModal({
    title: isNew ? 'Nuevo producto' : 'Editar producto',
    content: wrap,
    actions: [
      { label: 'Cancelar', class: 'btn btn--secondary' },
      { label: 'Guardar', class: 'btn btn--primary', close: false, callback: async () => {
        const name = wrap.querySelector('#pf-name')?.value.trim();
        if (!name) { toast('El nombre es obligatorio', 'error'); return; }
        const data = {
          ...existing,
          id:          existing?.id,
          name,
          category:    wrap.querySelector('#pf-category')?.value,
          description: wrap.querySelector('#pf-desc')?.value.trim(),
          image:       wrap.querySelector('#pf-image-url')?.value.trim() || null,
          available:   wrap.querySelector('#pf-available')?.checked,
          variants:    variants.length ? variants : [],
          price:       variants.length ? null : Number(wrap.querySelector('#pf-price')?.value) || 0,
          costPrice:   variants.length ? null : Number(wrap.querySelector('#pf-cost')?.value) || 0,
        };
        if (!data.id) delete data.id;
        await onSave(data);
        closeModal();
      }},
    ]
  });
}

/**
 * promotions.js — Gestión de promociones
 */

const PROMO_TYPES = {
  percent: '% Descuento porcentual',
  fixed:   '€ Descuento fijo por unidad',
  bundle:  '📦 Oferta por cantidad (pack)',
};

const STATUS_LABELS = {
  upcoming: { label: 'Próxima',       color: '#E3F2FD', text: '#1565C0' },
  active:   { label: 'Activa',        color: '#E8F5E9', text: '#1B5E20' },
  ending:   { label: 'Acaba pronto',  color: '#FFF3E0', text: '#E65100' },
  ended:    { label: 'Finalizada',    color: '#FAFAFA', text: '#757575' },
  disabled: { label: 'Desactivada',   color: '#FFEBEE', text: '#B71C1C' },
};

function promoStatus(p) {
  if (!p.enabled) return 'disabled';
  const now = new Date();
  if (p.startDate && new Date(p.startDate) > now) return 'upcoming';
  if (p.endDate) {
    const end = new Date(p.endDate);
    if (end < now) return 'ended';
    // Acaba en menos de 48h
    if (end - now < 48 * 3600 * 1000) return 'ending';
  }
  return 'active';
}

async function renderPromotions(container) {
  let promos   = await getAllPromotions();
  let products = await getAllProducts();
  let filter   = 'all';

  function filtered() {
    if (filter === 'all') return promos;
    return promos.filter(p => promoStatus(p) === filter);
  }

  function renderList() {
    const listEl = container.querySelector('#promos-list');
    if (!listEl) return;
    const list = filtered().sort((a,b) => {
      const order = ['active','ending','upcoming','ended','disabled'];
      return order.indexOf(promoStatus(a)) - order.indexOf(promoStatus(b));
    });
    if (list.length === 0) {
      listEl.innerHTML = `<p class="empty-msg">No hay promociones con este filtro.</p>`;
      return;
    }
    listEl.innerHTML = list.map(p => {
      const st  = promoStatus(p);
      const stl = STATUS_LABELS[st];
      return `<div class="promo-card" data-id="${p.id}">
        <div class="promo-card__header">
          <span class="chip" style="background:${stl.color};color:${stl.text}">${stl.label}</span>
          <strong>${esc(p.name)}</strong>
          <label class="toggle promo-card__toggle" title="${p.enabled?'Desactivar':'Activar'}">
            <input type="checkbox" class="promo-toggle" data-id="${p.id}" ${p.enabled?'checked':''}>
            <span class="toggle__slider"></span>
          </label>
        </div>
        <p class="promo-card__desc">${esc(promoDescription(p))}</p>
        <div class="promo-card__meta">
          ${p.startDate ? `<small>Inicio: ${formatDate(p.startDate)}</small>` : ''}
          ${p.endDate   ? `<small>Fin: ${formatDate(p.endDate)}</small>` : '<small>Sin fecha de fin</small>'}
        </div>
        <div class="promo-card__actions">
          <button class="btn btn--sm btn--secondary promo-edit" data-id="${p.id}">✏️ Editar</button>
          <button class="btn btn--sm btn--danger promo-del" data-id="${p.id}">🗑 Eliminar</button>
        </div>
      </div>`;
    }).join('');

    listEl.querySelectorAll('.promo-toggle').forEach(cb => {
      cb.addEventListener('change', async () => {
        const p = promos.find(x => x.id === Number(cb.dataset.id));
        if (!p) return;
        p.enabled = cb.checked;
        await savePromotion(p);
        promos = await getAllPromotions();
        renderList();
        toast(p.enabled ? 'Promoción activada' : 'Promoción desactivada', 'info');
      });
    });
    listEl.querySelectorAll('.promo-edit').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = promos.find(x => x.id === Number(btn.dataset.id));
        if (p) showPromoForm(p, products, async (updated) => {
          await savePromotion(updated);
          promos = await getAllPromotions();
          renderList();
          toast('Promoción guardada', 'success');
        });
      });
    });
    listEl.querySelectorAll('.promo-del').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (await confirm('¿Eliminar esta promoción?', { confirmLabel: 'Eliminar', danger: true })) {
          await deletePromotion(Number(btn.dataset.id));
          promos = await getAllPromotions();
          renderList();
          toast('Promoción eliminada', 'info');
        }
      });
    });
  }

  container.innerHTML = `
    <div class="view-promotions">
      <div class="view-header">
        <h2 class="view-header__title">Promociones</h2>
        <button class="btn btn--primary" id="btn-new-promo">+ Nueva</button>
      </div>
      <div class="status-tabs">
        <button class="tab tab--active" data-filter="all">Todas</button>
        ${Object.entries(STATUS_LABELS).map(([k,v]) =>
          `<button class="tab" data-filter="${k}">${v.label}</button>`
        ).join('')}
      </div>
      <div id="promos-list"></div>
    </div>`;

  renderList();

  container.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.tab').forEach(b => b.classList.remove('tab--active'));
      btn.classList.add('tab--active');
      filter = btn.dataset.filter;
      renderList();
    });
  });

  container.querySelector('#btn-new-promo').addEventListener('click', () => {
    showPromoForm(null, products, async (data) => {
      await savePromotion(data);
      promos = await getAllPromotions();
      renderList();
      toast('Promoción creada', 'success');
    });
  });
}

function promoDescription(p) {
  if (p.type === 'percent') return `${p.value}% de descuento`;
  if (p.type === 'fixed')   return `${formatPrice(p.value)} de descuento por unidad`;
  if (p.type === 'bundle')  return `${p.bundleQty} unidades por ${formatPrice(p.bundlePrice)}`;
  return '';
}

function renderTypeFields(el, type, existing) {
  if (type === 'percent') {
    el.innerHTML = `<div class="field"><label class="field__label">Porcentaje de descuento (%)</label>

  } else if (type === 'fixed') {
    el.innerHTML = `<div class="field"><label class="field__label">Descuento fijo por unidad (€)</label>
      <input class="field__input" id="prom-value" type="number" min="0.01" step="0.01" value="${existing?.value||''}" placeholder="Ej: 2.00"></div>`;

function toLocalInput(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}


// ═══ stats.js ═══
/**
 * stats.js — Estadísticas y control económico
 */

async function renderStats(container) {
  const [allOrders, allClients, vipSpend, vipOrders] = await Promise.all([
    getAllOrders(),
    getAllClients(),
    getSetting('vipMinSpend', 300),
    getSetting('vipMinOrders', 10),
  ]);
  const vipSettings = { minSpend: vipSpend, minOrders: vipOrders };

  let period = 'month'; // day | month | year | custom
  let customStart = null, customEnd = null;

  function filterOrders() {
    const now = new Date();
    return allOrders.filter(o => {
      if (o.status !== 'delivered') return false;
      const d = new Date(o.createdAt);
      if (period === 'day')   return d.toDateString() === now.toDateString();
      if (period === 'month') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
      if (period === 'year')  return d.getFullYear()===now.getFullYear();
      if (period === 'custom' && customStart && customEnd) {
        return d >= new Date(customStart) && d <= new Date(customEnd + 'T23:59:59');
      }
      return true;
    });
  }

  function renderContent() {
    const orders = filterOrders();
    const billing = orders.reduce((s, o) => s + (o.total||0), 0);
    const cost    = orders.reduce((s, o) => s + (o.costTotal||0), 0);
    const profit  = billing - cost;
    const discount = orders.reduce((s, o) => s + (o.discount||0), 0);

    // Clientes
    const clientOrders = {};
    orders.forEach(o => {
      if (!clientOrders[o.clientId]) clientOrders[o.clientId] = [];
      clientOrders[o.clientId].push(o);
    });
    const newClients       = allClients.filter(c => clientCategory(c, allOrders, vipSettings) === 'NUEVO').length;
    const habitualClients  = allClients.filter(c => clientCategory(c, allOrders, vipSettings) === 'HABITUAL').length;
    const inactiveClients  = allClients.filter(c => clientCategory(c, allOrders, vipSettings) === 'INACTIVO').length;
    const avgSpend         = allClients.length ? billing / allClients.length : 0;

    // Productos más vendidos
    const prodSales = {};
    orders.forEach(o => (o.lines||[]).forEach(l => {
      const key = l.productName || l.productId;
      if (!prodSales[key]) prodSales[key] = { name: key, qty: 0, revenue: 0 };
      prodSales[key].qty     += l.qty || 0;
      prodSales[key].revenue += l.totalPrice || 0;
    }));

// ─── Gráfico de barras SVG ────────────────────────────────────────────────────

function buildMonthlyData(orders) {
  const data = {};
  const now  = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    data[key] = { label: d.toLocaleDateString('es-ES',{month:'short',year:'2-digit'}), value: 0 };
  }
  orders.filter(o => o.status === 'delivered').forEach(o => {
    const d = new Date(o.createdAt);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (data[key]) data[key].value += o.total || 0;
  });
  return Object.values(data);
}

function renderBarChart(data) {
  const max   = Math.max(...data.map(d => d.value), 1);
  const W     = 100 / data.length;
  const bars  = data.map((d, i) => {
    const h = Math.round((d.value / max) * 100);
    return `<g transform="translate(${i * W + W*0.1}%, 0)">
      <rect x="0" y="${100-h}%" width="${W*0.8}%" height="${h}%" fill="var(--color-primary)" rx="2"/>
      <text x="${W*0.4}%" y="98%" text-anchor="middle" class="chart-label">${d.label}</text>
    </g>`;
  }).join('');
  return `<svg class="bar-chart" viewBox="0 0 400 180" preserveAspectRatio="none">
    <style>.chart-label{font-size:9px;fill:var(--color-text-muted);}</style>
    <g transform="translate(0,10)">${bars}</g>
  </svg>`;
}

function renderCategoryChart(catSales) {
  const total = Object.values(catSales).reduce((s, v) => s + v, 0) || 1;
  const colors = ['#2E7D32','#43A047','#66BB6A','#A5D6A7','#C8E6C9'];
  let rows = '';
  let i = 0;
  for (const [cat, val] of Object.entries(catSales).sort((a,b)=>b[1]-a[1])) {
    const pct = Math.round((val/total)*100);
    rows += `<div class="cat-bar">
      <span class="cat-bar__label">${esc(cat)}</span>
      <div class="cat-bar__track">
        <div class="cat-bar__fill" style="width:${pct}%;background:${colors[i%colors.length]}"></div>
      </div>
      <span class="cat-bar__pct">${pct}% (${formatPrice(val)})</span>
    </div>`;
    i++;
  }
  return `<div class="cat-chart">${rows}</div>`;
}

async function navigate(view, params = {}) {
  const renderer = ROUTES[view];
  if (!renderer) return;
  App.currentView = view;
  updateNav(view);
  const main = document.getElementById('vb-main');
  main.innerHTML = '<div class="loading-view"><div class="spinner__ring"></div></div>';
  try {
    await renderer(main, params);
  } catch (err) {
    console.error('Error en vista', view, err);
    main.innerHTML = `<div class="error-view"><p>Error al cargar esta sección.</p><pre>${err.message}</pre></div>`;
  }
}

  document.querySelectorAll('.nav__item').forEach(el => {
    el.classList.toggle('nav__item--active', el.dataset.view === active);

}

      navigate(el.dataset.view);
      closeSideNav();
    });
  });

  // Menú hamburguesa
  document.getElementById('menu-btn').addEventListener('click', toggleSideNav);
  document.getElementById('btn-logout').addEventListener('click', async () => {
    if (await Promise.resolve().then(() => confirm('¿Cerrar sesión?', { confirmLabel: 'Salir', danger: false }))) {
      logout();
      location.reload();
    }
  });

  await navigate('dashboard');
}

function navItem(view, icon, label) {
  return `<li class="nav__item" data-view="${view}" role="button" tabindex="0">
    <span class="nav__icon">${icon}</span>
    <span class="nav__label">${label}</span>
  </li>`;
}

function toggleSideNav() {
  document.getElementById('side-nav')?.classList.toggle('side-nav--open');
}
function closeSideNav() {
  document.getElementById('side-nav')?.classList.remove('side-nav--open');
}

// ─── Inicialización ───────────────────────────────────────────────────────────

async function init() {
  try {
    await openDB();
    if (!isLoggedIn()) {
      const firstRun = await isFirstRun();
      renderLoginScreen(firstRun);
    } else {
      await bootApp();
    }
  } catch (err) {
    console.error('Error al inicializar la app', err);
    document.body.innerHTML = `<div class="fatal-error">
      <h1>Error al iniciar VeritosBusiness</h1>
      <p>${err.message}</p>
      <p>Recarga la página e inténtalo de nuevo.</p>
    </div>`;
  }
}

// Registrar Service Worker — funciona en raíz y en subcarpeta GitHub Pages
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // Calcula la base desde window.location para compatibilidad máxima
    const base = window.location.pathname.replace(/\/[^/]*$/, '/');
    navigator.serviceWorker.register(base + 'sw.js', { scope: base })
      .catch(err => console.warn('SW no registrado:', err));
  });
}



// ─── Arranque ─────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const base = window.location.pathname.replace(/\/[^\/]*$/, '/');
    navigator.serviceWorker.register(base + 'sw.js', { scope: base }).catch(console.warn);
  });
}
document.addEventListener('DOMContentLoaded', init);

  </script>
